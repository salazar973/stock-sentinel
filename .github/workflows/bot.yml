name: stock-sentinel

# Runs the paper-trading bot every 5 minutes (GitHub's fastest free schedule).
# Also runnable on demand from the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write            # needed to commit state.json back to the repo

concurrency:
  group: stock-sentinel      # never let two runs overlap
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run one tick
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: node bot.js

      - name: Commit updated state
        run: |
          git config user.name  "stock-sentinel-bot"
          git config user.email "stock-sentinel-bot@users.noreply.github.com"
          git add state.json
          git commit -m "state: tick update [skip ci]" || echo "no changes to commit"
          git push
